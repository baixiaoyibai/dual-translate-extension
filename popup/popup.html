<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>双语翻译助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <h1 class="popup-title">双语翻译助手</h1>
    </div>

    <div class="popup-toggle">
      <button id="toggleBtn" class="toggle-btn active">
        <span class="toggle-icon">⏸</span>
        <span class="toggle-text">关闭翻译</span>
      </button>
      <button id="cancelBtn" class="cancel-btn">
        <span>✕</span>
        <span class="cancel-text">取消翻译</span>
      </button>
    </div>

    <div class="popup-section">
      <div class="section-title">显示模式</div>
      <div class="mode-selector" id="modeSelector">
        <button class="mode-btn active" data-mode="bilingual">
          <span class="mode-icon">📄</span>
          <span class="mode-label">双语对照</span>
        </button>
        <button class="mode-btn" data-mode="translation-only">
          <span class="mode-icon">🔄</span>
          <span class="mode-label">仅译文</span>
        </button>
        <button class="mode-btn" data-mode="hover">
          <span class="mode-icon">🖱</span>
          <span class="mode-label">悬停翻译</span>
        </button>
        <button class="mode-btn" data-mode="panel">
          <span class="mode-icon">📋</span>
          <span class="mode-label">对照面板</span>
        </button>
      </div>
    </div>

    <div class="popup-section">
      <div class="section-title">源语言</div>
      <div class="source-lang-selector">
        <select id="sourceLangSelect">
          <option value="auto">自动检测</option>
          <option value="en">英文</option>
          <option value="ja">日文</option>
          <option value="all">所有非中文</option>
        </select>
        <div id="sourceLangHint" class="source-lang-hint">翻译中...</div>
      </div>
    </div>

    <div class="popup-section">
      <div class="setting-row compact">
        <div class="setting-info">
          <div class="setting-label">翻译中文页英文</div>
          <div class="setting-desc">关闭时跳过含中文的段落，开启时翻译所有英文内容</div>
        </div>
        <label class="mini-toggle"><input type="checkbox" id="skipChineseSegmentsToggle"><span class="mini-toggle-slider"></span></label>
      </div>
    </div>

    <div class="popup-section">
      <div class="section-title">文本翻译</div>
      <textarea id="manualTranslateInput" class="manual-text-input" placeholder="粘贴或输入要翻译的文本..." rows="3" maxlength="10000"></textarea>
      <button id="manualTranslateBtn" class="manual-translate-btn">翻译</button>
      <div id="manualTranslateResult" class="manual-translate-result"></div>
    </div>

    <div class="popup-section">
      <div class="section-title">API 状态</div>
      <div id="apiStatus" class="api-status">
        <div class="status-loading">加载中...</div>
      </div>
    </div>

    <div class="popup-section">
      <div class="section-title">今日用量</div>
      <div id="apiUsage" class="api-usage">
        <div class="status-loading">加载中...</div>
      </div>
    </div>

    <div class="popup-section">
      <div class="section-title">缓存</div>
      <div id="cacheInfo" class="cache-info">
        加载中...
      </div>
    </div>

    <div class="popup-footer">
      <button id="settingsBtn" class="footer-btn">⚙ 设置</button>
      <button id="restoreBtn" class="footer-btn">↺ 还原原文</button>
    </div>
  </div>
  <script src="../lib/escape-utils.js"></script>
  <script src="../lib/api-metadata.js"></script>
  <script src="popup.js"></script>
</body>
</html>
